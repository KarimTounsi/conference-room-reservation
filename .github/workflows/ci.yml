name: CI

# Only main: the feature branches and dev are integrated locally, and a build per branch would
# repeat the same work without telling anyone anything new.
on:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ubuntu-latest ships Docker, so Testcontainers needs no extra setup.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build image (no push)
        run: docker build -t conference-room-reservation:ci .
