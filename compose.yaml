# Everything in containers:      docker compose up --build
# Database only, app from Maven: docker compose up -d postgres
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: conference_room_reservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d conference_room_reservation" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/conference_room_reservation

volumes:
  postgres-data:
